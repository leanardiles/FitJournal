{% extends 'base.html' %}

{% block extra_css %}
<style>
    .nb-dashboard-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 32px;
        align-items: start;
    }
    .nb-module { min-width: 0; }

    /* Collapse to a single column on narrow screens */
    @media (max-width: 900px) {
        .nb-dashboard-grid { grid-template-columns: 1fr; }
    }

    /* Quick stats: labels match the routine text; values in red */
    .nb-stat-item { color: var(--text); font-size: var(--fs); }
    .nb-stat-item .nb-val { color: var(--red); }
    body.light .nb-stat-item .nb-val { color: var(--red); }

    /* Day list: all days in --text; underline the current day (← today tag stays red) */
    .nb-day-label.nb-today,
    .nb-day-label.nb-other,
    .nb-day-muscles,
    .nb-day-muscles.nb-today { color: var(--text); }
    body.light .nb-day-label.nb-today,
    body.light .nb-day-muscles.nb-today { color: var(--text); }

    .nb-day-label.nb-today,
    .nb-day-muscles.nb-today {
        text-decoration: underline;
        text-decoration-color: var(--red);
        text-underline-offset: 3px;
    }

    /* Sets-by-muscle module */
    .nb-week-toggle { display: flex; gap: 8px; margin-bottom: 6px; }
    .nb-wk-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); font-family: 'Patrick Hand', cursive; font-size: 13px; padding: 0 10px; height: calc(var(--lh) - 12px); border-radius: 8px; cursor: pointer; transition: all 0.12s; }
    .nb-wk-btn:hover { color: var(--text); }
    .nb-wk-btn.nb-selected { border-color: var(--red-border); color: #ccc; background: var(--active-bg); }
    .nb-muscle-sum-row { display: flex; align-items: flex-end; min-height: var(--lh); padding-bottom: 4px; gap: 10px; }
    .nb-muscle-sum-name { flex: 1; color: var(--text); font-size: var(--fs); }
    .nb-muscle-sum-sets { color: var(--red); font-size: var(--fs); }
</style>
{% endblock %}

{% block content %}

<div class="nb-dashboard-grid">
    <!-- Left column: quick stats -->
    <div class="nb-module">
        <div class="nb-section-label">quick stats</div>
        <div class="nb-stat-row">
            <div class="nb-stat-item">
                This week: <span class="nb-val" id="workouts-this-week">—</span>
            </div>
            <div class="nb-stat-item">
                Current day: <span class="nb-val" id="current-day">—</span>
            </div>
        </div>
    </div>

    <!-- Middle column: current routine -->
    <div class="nb-module">
        <div class="nb-section-label">your current routine</div>
        <div id="routine-container">
            <div class="nb-row">
                <span style="color: var(--muted);">Loading...</span>
            </div>
        </div>
    </div>

    <!-- Right column: sets per muscle this week -->
    <div class="nb-module">
        <div class="nb-section-label">sets per muscle</div>
        <div class="nb-week-toggle">
            <button type="button" class="nb-wk-btn nb-selected" data-mode="week">This week</button>
            <button type="button" class="nb-wk-btn" data-mode="7day">Last 7 days</button>
        </div>
        <div id="muscle-summary">
            <div class="nb-row"><span style="color: var(--muted);">Loading...</span></div>
        </div>
    </div>
</div>
<div id="message" class="nb-message" style="display:none;"></div>

{% endblock %}

{% block extra_js %}
<script>
    if (requireLogin()) {
        document.addEventListener('DOMContentLoaded', async () => {
            await Promise.all([loadRoutine(), loadStats(), loadMuscleSummary()]);
        });
    }

    async function loadStats() {
        try {
            const userId = getCurrentUserId();
            const res = await fetch(`${API_URL}/workout/state/${userId}`, { headers: authHeaders() });
            const stateData = await res.json();
            document.getElementById('current-day').textContent = `Day ${stateData.current_day_number}`;

            const sessions = await getWorkoutSessions(userId, 20);
            const now = new Date();
            const day = now.getDay();
            const diff = now.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(now.setDate(diff));
            monday.setHours(0,0,0,0);
            const thisWeek = sessions.filter(s => new Date(s.workout_date) >= monday).length;
            document.getElementById('workouts-this-week').textContent = thisWeek;
        } catch(e) {
            document.getElementById('current-day').textContent = '—';
        }
    }

    async function loadRoutine() {
        const container = document.getElementById('routine-container');
        const routine = await requireRoutine();

        if (!routine) {
            container.innerHTML = `
                <div class="nb-row">
                    <span style="color: var(--muted);">No routine set up yet.</span>
                    <a href="/web/routine" class="nb-btn" style="margin-left:16px;">Create Routine</a>
                </div>`;
            return;
        }

        let currentDay = 1;
        try {
            const userId = getCurrentUserId();
            const res = await fetch(`${API_URL}/workout/state/${userId}`, { headers: authHeaders() });
            const data = await res.json();
            currentDay = data.current_day_number;
        } catch(e) {}

        // Routine type: uniform if all days share one, otherwise mixed
        const dayTypes = new Set((routine.days || []).map(d => d.day_type));
        let typeLabel = 'By muscle group';
        if (dayTypes.size > 1) typeLabel = 'Mixed';
        else if ([...dayTypes][0] === 'manual') typeLabel = 'Manual';

        let html = `
            <div class="nb-row" style="color:var(--text);font-size:var(--fs);">
                Routine type:<span style="color:var(--red);margin-left:6px;">${typeLabel}</span>
            </div>
            <div class="nb-row" style="color:var(--text);font-size:var(--fs);">
                Training <span style="color:var(--red);margin:0 4px;">${routine.days_per_week}</span> ${routine.days_per_week === 1 ? 'day' : 'days'} per week
            </div>`;

        (routine.days || []).forEach(dayObj => {
            const day = dayObj.day_number;
            const isToday = day === currentDay;
            const label = dayObj.name ? `Day ${day} — ${dayObj.name}` : `Day ${day}`;
            let detail = '';
            if (dayObj.day_type !== 'manual') {
                detail = (dayObj.muscles || []).map(m => m.muscle_group).join(', ') || 'Rest day';
            }
            html += `
                <div class="nb-day-row" style="padding-left:20px;">
                    <span class="nb-day-label ${isToday ? 'nb-today' : 'nb-other'}">${label}${detail ? ' —' : ''}</span>
                    <span class="nb-day-muscles ${isToday ? 'nb-today' : ''}">${detail}</span>
                    ${isToday ? '<span class="nb-today-tag">← today</span>' : ''}
                </div>`;
        });
        html += `
            <div class="nb-spacer"></div>
            <div class="nb-row">
                <a href="/web/routine" class="nb-btn">✎ Edit Routine</a>
            </div>`;

        container.innerHTML = html;
    }

    // ---------- Sets per muscle (this week / last 7 days) ----------
    let smLogs = [];
    let smExMuscle = {};   // exercise_id -> muscle_group
    let smMode = 'week';   // 'week' (Mon-based) | '7day' (rolling)

    async function loadMuscleSummary() {
        const userId = getCurrentUserId();
        const [logs, exercises] = await Promise.all([
            getWorkoutLogs(userId, 300),   // generous window; we filter to the week client-side
            getUserExercises(),
        ]);
        smLogs = logs || [];
        smExMuscle = {};
        (exercises || []).forEach(ex => { smExMuscle[ex.exercise_id] = ex.exercise_muscle_group; });

        document.querySelectorAll('.nb-wk-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                smMode = e.target.dataset.mode;
                document.querySelectorAll('.nb-wk-btn').forEach(b => b.classList.remove('nb-selected'));
                e.target.classList.add('nb-selected');
                renderMuscleSummary();
            });
        });

        renderMuscleSummary();
    }

    function smWindowStart() {
        const now = new Date();
        if (smMode === '7day') {
            const d = new Date(now);
            d.setDate(d.getDate() - 6);   // rolling 7 days, including today
            d.setHours(0, 0, 0, 0);
            return d;
        }
        // Monday-based current week (matches the 'This week' quick stat)
        const day = now.getDay();
        const diff = now.getDate() - day + (day === 0 ? -6 : 1);
        const monday = new Date(now);
        monday.setDate(diff);
        monday.setHours(0, 0, 0, 0);
        return monday;
    }

    function renderMuscleSummary() {
        const container = document.getElementById('muscle-summary');
        const start = smWindowStart();

        const totals = {};
        smLogs.forEach(log => {
            if (new Date(log.workout_date) < start) return;
            const muscle = smExMuscle[log.exercise_id];
            if (!muscle) return;   // exercise no longer in the library
            totals[muscle] = (totals[muscle] || 0) + (log.sets_completed || 0);
        });

        const entries = Object.entries(totals)
            .filter(([, sets]) => sets > 0)
            .sort((a, b) => b[1] - a[1]);

        if (!entries.length) {
            container.innerHTML = '<div class="nb-row"><span style="color: var(--muted);">No sets logged in this window.</span></div>';
            return;
        }

        container.innerHTML = entries.map(([muscle, sets]) => `
            <div class="nb-muscle-sum-row">
                <span class="nb-muscle-sum-name">${muscle}</span>
                <span class="nb-muscle-sum-sets">${sets} ${sets === 1 ? 'set' : 'sets'}</span>
            </div>`).join('');
    }
</script>
{% endblock %}
